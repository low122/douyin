[project]
name = "douyin-kb"
version = "0.1.0"
description = "Turns saved Douyin videos into searchable moments."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "httpx>=0.28",
    "arq>=0.26",
    "openai>=1.60",
    "instructor>=1.7",
    "jieba>=0.42",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Import `app` from the repo root without installing the package first.
pythonpath = ["."]
